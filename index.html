<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf7" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          if (localStorage.getItem('resume-theme') === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <meta
      name="description"
      content="David Samy — full-stack software engineer. Portfolio, experience, and selected GitHub projects."
    />
    <meta property="og:title" content="David Samy — Full-Stack Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio résumé with HR ERP, Talé hotel booking, Arabic cinema archives, and English learning platform work."
    />
    <meta property="og:type" content="website" />
    <!-- Replace with your live URL after deploying to Hostinger -->
    <meta property="og:url" content="https://example.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>David Samy — Digital Résumé</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
